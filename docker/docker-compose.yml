name: galeria_vincent_van_gogh

services:
  db:
    image: postgres:16.11
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: galeria_vangogh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend
    command: ["sh", "-c", "python manage.py migrate && exec python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media_volume:/app/media
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no .env}"
      POSTGRES_DB: galeria_vangogh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/obras/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
